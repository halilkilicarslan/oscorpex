# ---------------------------------------------------------------------------
# Oscorpex — Docker Compose Container-Pool Override (dev only)
# ---------------------------------------------------------------------------
# Usage:
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose -f docker-compose.yml -f docker-compose.pool.yml up -d
#   (Docker Desktop on macOS: use the gid the socket shows inside a container, e.g.
#    docker run --rm -v /var/run/docker.sock:/s alpine stat -c %g /s)
#
# Enables: Docker socket in the backend (container pool management), OSCORPEX_ENABLE_CONTAINER_RUNTIME, and egress
# on the agent network (provider API access).
#
# WARNING: DEV ONLY. The Docker socket is root-equivalent on the host: mounting it defeats the backend's
# hardening (read-only rootfs, dropped capabilities, no-new-privileges). Never use this file in production.
# ---------------------------------------------------------------------------

services:
  backend:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # the backend runs as uid 1001, which needs the socket's group to use it
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the docker socket's gid}"
    environment:
      OSCORPEX_ENABLE_CONTAINER_RUNTIME: "true"

networks:
  studio-agents:
    internal: false
