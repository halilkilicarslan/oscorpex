# Console server: static SPA + reverse proxy to the kernel. Runs as uid 101 on a read-only rootfs
# (pid and temp paths are under /tmp in the base image's nginx.conf).
# The backend is addressed through variables + the Docker DNS resolver, so nginx starts (and `nginx -t` passes)
# without the backend being resolvable, and re-resolves it when the container is replaced.

server {
	listen 8080;
	server_name _;

	server_tokens off;
	absolute_redirect off;
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $backend_http backend:3141;
	set $backend_ws backend:3142;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

	include /etc/nginx/security-headers.conf;

	location = /health {
		include /etc/nginx/security-headers-api.conf;
		include /etc/nginx/proxy-params.conf;
		proxy_set_header Connection "";
		proxy_pass http://$backend_http;
	}

	# WebSocket (kernel WS server). The kernel validates Origin + ticket.
	location = /api/studio/ws {
		# only real upgrades; access log off so the one-time ticket in the query string never reaches the logs
		if ($http_upgrade !~* ^websocket$) {
			return 426;
		}
		access_log off;
		include /etc/nginx/security-headers-api.conf;
		include /etc/nginx/proxy-params.conf;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_pass http://$backend_ws;
	}

	# REST + SSE. Buffering is off so event streams are not held back (and no gzip: event-stream is not in gzip_types).
	location /api/ {
		include /etc/nginx/security-headers-api.conf;
		include /etc/nginx/proxy-params.conf;
		proxy_set_header Connection "";
		# API responses are per-user; hide the kernel's caching headers and never store
		proxy_hide_header Cache-Control;
		proxy_hide_header Expires;
		add_header Cache-Control "no-store" always;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 600s;
		client_max_body_size 20m;
		proxy_pass http://$backend_http;
	}

	# Vite emits content-hashed file names; a missing file must stay a 404 (never the SPA shell)
	location /assets/ {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location = /index.html {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-cache" always;
	}

	# SPA fallback; other root files (icons) revalidate
	location / {
		include /etc/nginx/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
