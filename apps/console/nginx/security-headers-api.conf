# Proxied kernel locations (/health, /api/, WebSocket): the kernel's own Content-Security-Policy and X-Frame-Options
# (e.g. the sandbox CSP on preview-proxy responses) must reach the browser untouched, so only these three are managed here.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
