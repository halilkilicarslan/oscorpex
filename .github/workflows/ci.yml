name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # P2-5: PostgreSQL service for DB-backed tests
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: oscorpex
          POSTGRES_PASSWORD: oscorpex_dev
          POSTGRES_DB: oscorpex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oscorpex -d oscorpex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://oscorpex:oscorpex_dev@localhost:5432/oscorpex_test
      NODE_ENV: test
      OSCORPEX_DEV_NO_AUTH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # pnpm comes from corepack so the packageManager sha512 pin is verified (the pnpm setup action does not)
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "12.6.0"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        run: git diff --exit-code pnpm-lock.yaml

      # Workspace packages resolve each other through dist/ (types and runtime), so typecheck and tests need it first.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Initialize test database
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f apps/kernel/scripts/init.sql
        env:
          PGPASSWORD: oscorpex_dev

      - name: Kernel tests
        run: pnpm --filter @oscorpex/kernel test

      - name: P0 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p0.config.ts

      - name: P1 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p1.config.ts

      - name: P2 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p2.config.ts

      - name: P3 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p3.config.ts

      - name: P4 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p4.config.ts

      - name: P5 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p5.config.ts

      - name: P6 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p6.config.ts

      - name: P7 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p7.config.ts

      - name: P8 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p8.config.ts

      - name: P9 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p9.config.ts

      - name: P10 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p10.config.ts

      - name: P11 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p11-unit.config.ts

      - name: P12 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p12.config.ts

      - name: P13 hardening tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.p13.config.ts

      - name: RC1 stabilization tests
        run: cd apps/kernel && pnpm exec vitest run --config vitest.rc1.config.ts

      - name: Policy-kit tests
        run: pnpm --filter @oscorpex/policy-kit test

      - name: Console tests
        run: pnpm --filter console test:run

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # throwaway CI-only database, used by check-deploy.sh for its scratch databases
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: oscorpex
          POSTGRES_PASSWORD: oscorpex_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oscorpex -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the image builds need ~15 GB free; the hosted runner starts with far less
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # pnpm comes from corepack so the packageManager sha512 pin is verified (the pnpm setup action does not)
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "12.6.0"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        run: git diff --exit-code pnpm-lock.yaml

      - name: Docker context check
        run: scripts/docker/check-context.sh

      - name: Docker context check (real build)
        run: scripts/docker/check-context.sh --real

      # must stay on the default docker buildx driver: do not add docker/setup-buildx-action to this job
      - name: Toolchain check
        run: scripts/docker/check-toolchain.sh --install

      - name: Deploy artifact check
        run: scripts/docker/check-deploy.sh --db postgresql://oscorpex:oscorpex_dev@localhost:5432/postgres

      - name: Kernel image smoke
        run: scripts/docker/smoke-kernel.sh

      - name: Console image smoke
        run: scripts/docker/smoke-console.sh

      - name: Compose stack smoke
        run: scripts/docker/smoke-compose.sh

      - name: Docker state
        if: always()
        run: |
          docker ps -a
          docker system df

  deps-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Policy: report-only. osv-scanner currently lists ~29 vulnerable packages in pnpm-lock.yaml, so failing here
    # would turn CI red immediately. The table is the job output; upgrading them is a separate task, after which
    # the exit-code tolerance below should be dropped to make the scan blocking.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # exit 1 means vulnerabilities were found (report-only); any other code is a real failure
      - name: osv-scanner
        run: |
          rc=0
          docker run --rm -v "$PWD":/src:ro -w /src ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source -L pnpm-lock.yaml -L docker/claude-cli/pnpm-lock.yaml || rc=$?  # v2.6.0
          [ "$rc" -le 1 ]

      - name: Workflow lint
        run: scripts/ci/check-workflow.sh
